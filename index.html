<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Table Reservation Test</title>
</head>

<body>

    <h1>Table Reservation</h1>

    <h2>Create Reservation</h2>

    <label>Customer Name:</label>
    <input type="text" id="resCustomer">
    <br><br>

    <label>Contact Number:</label>
    <input type="text" id="resContact">
    <br><br>

    <label>Facility Type:</label>
    <select id="resFacilityType" onchange="populateFacilitySelect()">
        <option value="Billiard">Billiard Table</option>
        <option value="KTV">KTV Room</option>
    </select>
    <br><br>

    <label>Facility:</label>
    <select id="resFacilitySelect">
        <!-- JavaScript will put Table 1, 2, 3 here -->
    </select>
    <br><br>

    <label>Date:</label>
    <input type="date" id="resDate">
    <br><br>

    <label>Start Time:</label>
    <input type="time" id="resStartTime">
    <br><br>

    <label>Duration:</label>
    <select id="resDurationSelect">
        <option value="30">30 Minutes</option>
        <option value="60" selected>1 Hour</option>
        <option value="120">2 Hours</option>
        <option value="180">3 Hours</option>
        <option value="240">4 Hours</option>
        <option value="300">5 Hours</option>
        <option value="360">6 Hours</option>
        <option value="420">7 Hours</option>
        <option value="480">8 Hours</option>
    </select>

    <br><br>

    <button onclick="handleCreateReservation()">
        Create Reservation
    </button>

    <p id="resMsg"></p>


    <hr>


    <h2>Find Reservation</h2>

    <input
        type="text"
        id="resSearchInput"
        placeholder="Customer Name or Reservation ID"
    >

    <button onclick="handleReservationSearch()">
        Find Reservation
    </button>

    <p id="resSearchMsg"></p>


    <hr>


    <h2>Reservation List</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Contact</th>
                <th>Facility</th>
                <th>Date</th>
                <th>Start</th>
                <th>End</th>
                <th>Duration</th>
                <th>Price</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="reservationsBody">
        </tbody>

    </table>


    <!-- Connect JavaScript -->
    <script src="table-reservation.js"></script>

</body>
</html>
